repos:
- repo: local
  hooks:
    - id: ruff-check
      name: ruff-check
      entry: ruff check --fix --force-exclude
      language: system
      types_or: [python, pyi]

    - id: ruff-format
      name: ruff-format
      entry: ruff format --force-exclude
      language: python
      types_or: [ python, pyi ]

