[project]
name = "task-scheduler"
version = "0.1.0"
description = ""
authors = [
    {name = "ratmeow",email = "rtm_bis@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "dishka (>=1.10.1,<2.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "fastapi (>=0.141.1,<0.142.0)"
]

[tool.poetry]
packages = [{include = "task_scheduler", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
test = [
    "pytest (>=9.1.1,<10.0.0)"
]
dev = [
    "ruff (>=0.17.3,<0.18.0)",
    "pre-commit (>=4.7.0,<5.0.0)"
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]