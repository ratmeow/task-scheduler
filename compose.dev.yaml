services:

  dev-postgres:
    image: "postgres:16-alpine"
    ports:
      - ${POSTGRES_PORT}:5432
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    volumes:
      - dev-postgres-data:/var/lib/postgresql/data

  dev-redis:
    image: redis:7.2
    ports:
      - ${REDIS_PORT}:6379
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - dev-redis-data:/data

  dev-backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - ${APP_PORT:-8000}:8000
    environment:
      POSTGRES_HOST: dev-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
      REDIS_HOST: dev-redis
      REDIS_PORT: 6379
      ACCESS_TOKEN_SECRET: "${ACCESS_TOKEN_SECRET}"
    depends_on:
      dev-postgres:
        condition: service_healthy
      dev-redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src

  dev-frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    environment:
      BACKEND_UPSTREAM: http://dev-backend:8000
    depends_on:
      - dev-backend

volumes:
  dev-postgres-data:
  dev-redis-data:
